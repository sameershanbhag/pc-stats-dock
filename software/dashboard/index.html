<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Stats Dock Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Single dark theme on purpose: this is a sensor panel, painted explicitly for any host ground. */
  :root {
    --bg: #0A0E0D; --panel: #121917; --panel-2: #182120; --line: #24302D;
    --ink: #E6EBE8; --muted: #8B9793; --dim: #56635F;
    --accent: #E08C4C; --teal: #6FBFC6; --warn: #E2B25A; --bad: #E0645A; --ok: #7CC48B;
    --track: #1E2927;
    --display: "Chakra Petch", "Trebuchet MS", sans-serif;
    --mono: "IBM Plex Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--mono); overflow: hidden; user-select: none; touch-action: manipulation; }
  #viewport { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); }
  /* The stage is always 1540x720 logical pixels and is scaled to fit whatever screen it is on. */
  #stage { width: 1540px; height: 720px; transform-origin: center; display: grid; grid-template-rows: 48px 1fr; gap: 10px; padding: 14px 18px 16px; background: var(--bg); }

  header { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; border-bottom: 1px solid var(--line); }
  header .name { font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: .04em; }
  header .name small { font-family: var(--mono); font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 12px; letter-spacing: .1em; text-transform: uppercase; }
  header .status { display: flex; align-items: center; gap: 18px; font-size: 13px; color: var(--muted); letter-spacing: .06em; }
  header .gear { background: transparent; border: 1px solid var(--line); color: var(--muted); font-size: 17px; line-height: 1; width: 38px; height: 32px; cursor: pointer; padding: 0; }
  header .gear:active { color: var(--accent); border-color: var(--accent); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--dim); margin-right: 7px; vertical-align: middle; }
  .dot.live { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .dot.demo { background: var(--warn); }
  #clock { font-family: var(--display); font-size: 24px; color: var(--ink); font-variant-numeric: tabular-nums; }

  main { display: grid; grid-template-columns: 920px 1fr; gap: 14px; min-height: 0; }
  main.three { grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  main.three .left { grid-template-rows: 296px minmax(0, 1fr) 64px; gap: 10px; }
  main.three .rings { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; }
  main.three .ring { padding: 8px 10px 4px; }
  main.three .ring .k { font-size: 10px; }
  main.three .tiles { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); grid-auto-flow: dense; gap: 8px; }
  main.three .tile { padding: 7px 10px; }
  main.three .tile .k { font-size: 10px; letter-spacing: .1em; }
  main.three .tile .v { font-size: 22px; }
  main.three .tile .v small { font-size: 11px; }
  main.three .tile .s { font-size: 10px; }
  main.three .bar { height: 6px; }
  main.three .spark { padding: 6px 10px 6px; }
  main.three .spark .k { font-size: 10px; }
  .center { display: grid; gap: 10px; min-height: 0; }
  .center[hidden] { display: none; }
  .left { display: grid; grid-template-rows: 250px minmax(0, 1fr) 150px; gap: 12px; min-height: 0; overflow: hidden; }
  .rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; min-height: 0; }
  .ring { background: var(--panel); border: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr); padding: 10px 12px 6px; min-height: 0; overflow: hidden; }
  .ring svg { min-height: 0; max-height: 100%; }
  .ring .k { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
  .ring svg { width: 100%; height: 100%; display: block; }
  .ring .v { font-family: var(--display); font-weight: 700; font-size: 44px; fill: var(--ink); }
  .ring .u { font-family: var(--mono); font-size: 13px; fill: var(--muted); }

  .tiles { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: 1fr 1fr; gap: 12px; min-height: 0; }
  .tile { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; display: grid; grid-template-rows: auto 1fr auto; gap: 2px; min-height: 0; }
  .tile.wide { grid-column: span 2; }
  .tile .k { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .tile .v { font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; align-self: end; }
  .tile .v small { font-family: var(--mono); font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .tile .s { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 8px; background: var(--track); position: relative; align-self: end; }
  .bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--teal); transition: width .4s; }

  .spark { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px 8px; display: grid; grid-template-rows: auto 1fr; gap: 4px; min-height: 0; }
  .spark .k { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; gap: 22px; }
  .spark .k b { font-weight: 400; } .spark .k b.cpu { color: var(--teal); } .spark .k b.gpu { color: var(--accent); }
  .spark canvas { width: 100%; height: 100%; display: block; }

  .keys { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); gap: 12px; min-height: 0; }
  .key { background: var(--panel-2); border: 1px solid var(--line); border-bottom: 3px solid #2C3A36; color: var(--ink); font-family: var(--display); text-align: left; padding: 12px 14px; display: grid; grid-template-rows: 1fr auto auto; cursor: pointer; transition: transform .06s, background .15s; }
  .key .g { font-size: 34px; line-height: 1; color: var(--accent); }
  .key .l { font-size: 19px; font-weight: 600; letter-spacing: .02em; }
  .key .sb { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; min-height: 14px; }
  .key:active, .key.pressed { transform: translateY(2px); border-bottom-width: 1px; background: #223330; }
  .key.on { border-color: var(--bad); border-bottom-color: var(--bad); }
  .key.on .g { color: var(--bad); }
  .key:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .key.blank { background: transparent; border-style: dashed; border-bottom-width: 1px; cursor: default; }

  .right { display: grid; min-height: 0; gap: 10px; }
  .right.feeds { grid-template-rows: 1fr 1fr; gap: 12px; }
  .right.feeds3 { grid-template-rows: 1fr 1fr 1fr; gap: 10px; }
  .right.feeds3 .feed .list { gap: 4px; padding: 6px 8px; }
  .right.feeds3 .msg .text { -webkit-line-clamp: 1; }
  .msg.ai { border-left-color: var(--dim); }
  .msg.ai.unseen { border-left-color: var(--ok); background: #1B2622; }
  .msg.ai.unseen .who { color: var(--ink); }
  .msg.ai.needs { border-left-color: var(--warn); }
  .msg.ai.needs.unseen { background: #2A2417; }
  .msg .state { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .msg.needs .state { color: var(--warn); } .msg.unseen:not(.needs) .state { color: var(--ok); }
  .feed .fh .st.new { color: var(--ok); }
  .right.mixed { grid-template-rows: 1.35fr 1fr; gap: 12px; }
  .right.mixed .keys { grid-template-rows: repeat(2, 1fr); }
  .feed { background: var(--panel); border: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .feed .fh { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 12px 6px; border-bottom: 1px solid var(--line); }
  .feed .fh .t { font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: .03em; }
  .feed .fh .st { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .feed .fh .st.warn { color: var(--warn); }
  .feed .list { overflow: hidden; padding: 8px 10px; display: grid; gap: 6px; align-content: start; }
  .msg { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; padding: 6px 9px; background: var(--panel-2); border-left: 2px solid var(--teal); cursor: pointer; }
  .msg.teams { border-left-color: var(--accent); }
  .msg .who { font-family: var(--display); font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg .when { font-size: 11px; color: var(--dim); }
  .msg .where { grid-column: 1 / -1; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg .text { grid-column: 1 / -1; font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .feed .empty { padding: 12px; font-size: 13px; color: var(--muted); line-height: 1.4; }
  .feed .empty b { color: var(--warn); font-weight: 500; }
  .banner { position: absolute; left: 18px; right: 18px; top: 64px; background: var(--panel-2); border: 1px solid var(--warn); color: var(--ink); font-size: 14px; padding: 10px 14px; display: none; z-index: 3; }
  .banner b { color: var(--warn); font-weight: 500; }
  .banner.show { display: block; }
  .key.needs { opacity: .55; }
  .key .sb.warn { color: var(--warn); text-transform: none; letter-spacing: 0; }
  .toast { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); color: var(--ink); font-size: 13px; padding: 8px 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.err { border-color: var(--bad); }

  /* Idle face: shown when the Mac has been left alone or is locked. Drawn per pixel on the GPU (WebGL 2) as two
     glass eyes; the SVG eyes underneath are the fallback where WebGL is missing. */
  #face { position: absolute; inset: 0; background: var(--bg); display: none; z-index: 5; --eye: #6FBFC6; opacity: 0; transition: opacity .38s ease; }
  #face.show { display: block; }
  #face.in { opacity: 1; }
  #face canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  #face.gl canvas { display: block; }
  #face.gl #faceEyes { display: none; }
  #face.gl svg { display: none; }
  #face.gl.hot svg, #face.gl.asleep svg { display: block; }
  #face svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #face .ball { fill: var(--eye); }
  #face .lid { fill: var(--bg); transform-box: fill-box; transition: transform .38s cubic-bezier(.3,.6,.2,1); }
  #face .lid.top { transform-origin: 50% 0%; transform: scaleY(0); }
  #face .lid.bot { transform-origin: 50% 100%; transform: scaleY(0); }
  #face .gaze, #face .blink { transform-box: fill-box; transform-origin: center; }
  #face .gaze { transition: transform .26s cubic-bezier(.2,.7,.2,1); }
  #face .blink { transition: transform .09s ease-in; }
  #face .drop { fill: #7FC8FF; opacity: 0; transition: opacity .4s; }
  #face.hot .drop { opacity: .9; animation: sweat 1.6s ease-in infinite; }
  @keyframes sweat { 0% { transform: translateY(0); } 100% { transform: translateY(26px); } }
  #face .zz { font-family: var(--display); font-size: 46px; fill: var(--dim); opacity: 0; }
  #face.asleep .zz { animation: zz 3.3s linear infinite; }
  #face.asleep .zz.z2 { animation-delay: 1.1s; } #face.asleep .zz.z3 { animation-delay: 2.2s; }
  @keyframes zz { 0% { opacity: 0; transform: translate(0,0); } 20% { opacity: .85; } 100% { opacity: 0; transform: translate(34px,-96px); } }
  #face .fclock { position: absolute; right: 28px; bottom: 18px; font-family: var(--display); font-size: 22px; color: var(--dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <header>
      <div class="name"><span id="pcName">PC</span><small id="modeLabel">connecting</small></div>
      <div class="status"><span><i class="dot" id="dot"></i><span id="dotText">sensors</span></span><span id="clock">--:--</span><button class="gear" id="adminBtn" type="button" aria-label="Open the admin page on your Mac">⚙</button></div>
    </header>
    <main id="main" class="two">
      <section class="left">
        <div class="rings">
          <div class="ring" id="r-cpu-load"></div>
          <div class="ring" id="r-cpu-temp"></div>
          <div class="ring" id="r-gpu-load"></div>
          <div class="ring" id="r-gpu-temp"></div>
        </div>
        <div class="tiles">
          <div class="tile wide"><span class="k">Memory</span><span class="v" id="t-ram">—</span><div class="bar"><i id="b-ram"></i></div></div>
          <div class="tile wide"><span class="k" id="k-vram">VRAM</span><span class="v" id="t-vram">—</span><div class="bar" id="bar-vram"><i id="b-vram"></i></div></div>
          <div class="tile"><span class="k">CPU clock</span><span class="v" id="t-cpu-clock">—</span><span class="s" id="s-cpu-name"></span></div>
          <div class="tile"><span class="k">CPU power</span><span class="v" id="t-cpu-power">—</span><span class="s">package</span></div>
          <div class="tile"><span class="k">GPU power</span><span class="v" id="t-gpu-power">—</span><span class="s" id="s-gpu-name"></span></div>
          <div class="tile"><span class="k" id="k-fan">GPU fan</span><span class="v" id="t-gpu-fan">—</span><span class="s" id="s-gpu-fan"></span></div>
          <div class="tile"><span class="k" id="k-hot">Hot spot</span><span class="v" id="t-hotspot">—</span><span class="s" id="s-hot">GPU</span></div>
          <div class="tile"><span class="k" id="k-drive">Drive</span><span class="v" id="t-nvme">—</span><span class="s" id="s-nvme"></span></div>
          <div class="tile wide"><span class="k">Network</span><span class="v" id="t-net">—</span><span class="s" id="s-net"></span></div>
        </div>
        <div class="spark"><div class="k"><span>Load · last 2 min</span><b class="cpu">■ CPU</b><b class="gpu">■ GPU</b></div><canvas id="spark" width="896" height="100"></canvas></div>
      </section>
      <section class="center" id="center" aria-label="Middle column" hidden></section>
      <section class="right" id="right" aria-label="Right side"></section>
    </main>
    <div class="banner" id="banner"></div>
    <div class="toast" id="toast"></div>
    <div id="face" aria-hidden="true">
      <canvas id="faceGL" width="1540" height="720"></canvas>
      <svg viewBox="0 0 1540 720" id="faceSvg" aria-label="Idle face">
        <defs><filter id="fglow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        <g class="breath">
          <g id="faceEyes">
            <g class="eye" transform="translate(546 352)">
              <g class="gaze"><g class="blink">
                <rect class="ball" x="-118" y="-142" width="236" height="284" rx="74" filter="url(#fglow)"/>
                <rect class="lid top" x="-130" y="-156" width="260" height="312" rx="80"/>
                <rect class="lid bot" x="-130" y="-156" width="260" height="312" rx="80"/>
              </g></g>
            </g>
            <g class="eye" transform="translate(994 352)">
              <g class="gaze"><g class="blink">
                <rect class="ball" x="-118" y="-142" width="236" height="284" rx="74" filter="url(#fglow)"/>
                <rect class="lid top" x="-130" y="-156" width="260" height="312" rx="80"/>
                <rect class="lid bot" x="-130" y="-156" width="260" height="312" rx="80"/>
              </g></g>
            </g>
          </g>
          <path class="drop" d="M1190 158 c0 -30 24 -52 24 -84 c0 32 24 54 24 84 a24 24 0 0 1 -48 0 z"/>
        </g>
        <text class="zz z1" x="1210" y="236">z</text><text class="zz z2" x="1252" y="206">z</text><text class="zz z3" x="1294" y="176">z</text>
      </svg>
      <div class="fclock" id="faceClock">--:--</div>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  window.__forceFace = new URLSearchParams(location.search).has('face');   // ?face previews the idle face
  window.__faceHappy = new URLSearchParams(location.search).has('happy');
  window.__faceStyle = new URLSearchParams(location.search).get('style');   // ?face&style=glass previews a look
  function fit() {
    const s = Math.min(window.innerWidth / 1540, window.innerHeight / 720);
    stage.style.transform = `scale(${s})`;
  }
  window.addEventListener('resize', fit); fit();

  // ---- rings -----------------------------------------------------------
  const R = 78, C = 2 * Math.PI * R;
  function makeRing(el, label, unit) {
    el.innerHTML = `<div class="k"><span>${label}</span><span class="peak" data-peak></span></div>
      <svg viewBox="0 0 200 190"><circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--track)" stroke-width="16"/>
      <circle class="arc" cx="100" cy="100" r="${R}" fill="none" stroke="var(--teal)" stroke-width="16" stroke-linecap="butt"
        stroke-dasharray="0 ${C}" transform="rotate(-90 100 100)"/>
      <text class="v" x="100" y="108" text-anchor="middle">—</text><text class="u" x="100" y="134" text-anchor="middle">${unit}</text></svg>`;
    return { arc: el.querySelector('.arc'), val: el.querySelector('.v'), peak: el.querySelector('[data-peak]'), max: 0 };
  }
  const rings = {
    cpuLoad: makeRing($('r-cpu-load'), 'CPU load', '%'),
    cpuTemp: makeRing($('r-cpu-temp'), 'CPU temp', '°C'),
    gpuLoad: makeRing($('r-gpu-load'), 'GPU load', '%'),
    gpuTemp: makeRing($('r-gpu-temp'), 'GPU temp', '°C'),
  };
  function tempColor(t, warn, bad) { return t >= bad ? 'var(--bad)' : t >= warn ? 'var(--warn)' : 'var(--teal)'; }
  function loadColor(p) { return p >= 90 ? 'var(--accent)' : 'var(--teal)'; }
  function setRing(r, value, max, color, fmt) {
    if (value == null) { r.val.textContent = '—'; r.arc.setAttribute('stroke-dasharray', `0 ${C}`); return; }
    const frac = Math.max(0, Math.min(1, value / max));
    r.arc.setAttribute('stroke-dasharray', `${(frac * C).toFixed(1)} ${C}`);
    r.arc.setAttribute('stroke', color);
    r.val.textContent = fmt(value);
    r.max = Math.max(r.max, value);
    r.peak.textContent = 'peak ' + fmt(r.max);
  }

  // ---- history / sparkline ---------------------------------------------
  const hist = { cpu: [], gpu: [] }, N = 240; // 2 min at 500 ms
  const cv = $('spark'), ctx = cv.getContext('2d');
  function drawSpark() {
    const w = cv.width, h = cv.height;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = '#24302D'; ctx.lineWidth = 1;
    [0.25, 0.5, 0.75].forEach(f => { ctx.beginPath(); ctx.moveTo(0, h * f); ctx.lineTo(w, h * f); ctx.stroke(); });
    const line = (arr, color) => {
      if (arr.length < 2) return;
      ctx.beginPath(); ctx.lineWidth = 2; ctx.strokeStyle = color;
      arr.forEach((v, i) => { const x = (i / (N - 1)) * w, y = h - (v / 100) * (h - 4) - 2; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.stroke();
      ctx.lineTo((arr.length - 1) / (N - 1) * w, h); ctx.lineTo(0, h); ctx.closePath();
      ctx.fillStyle = color.replace(')', ',0.12)').replace('rgb', 'rgba'); ctx.fill();
    };
    line(hist.gpu, 'rgb(224,140,76)'); line(hist.cpu, 'rgb(111,191,198)');
  }
  function push(arr, v) { arr.push(v == null ? (arr[arr.length - 1] || 0) : v); if (arr.length > N) arr.shift(); }

  // ---- render ----------------------------------------------------------
  const fmt1 = v => (Math.round(v * 10) / 10).toFixed(v >= 100 ? 0 : 1);
  const fmt0 = v => Math.round(v).toString();
  function txt(id, s) { $(id).textContent = s; }
  function render(d) {
    const cpu = d.cpu || {}, gpu = d.gpu || {}, ram = d.ram || {}, net = d.net || {}, st = (d.storage || [])[0];
    setRing(rings.cpuLoad, cpu.load, 100, loadColor(cpu.load || 0), fmt0);
    setRing(rings.cpuTemp, cpu.temp, 100, tempColor(cpu.temp || 0, 80, 90), fmt0);
    setRing(rings.gpuLoad, gpu.load, 100, loadColor(gpu.load || 0), fmt0);
    setRing(rings.gpuTemp, gpu.temp, 100, tempColor(gpu.temp || 0, 80, 88), fmt0);
    push(hist.cpu, cpu.load); push(hist.gpu, gpu.load); drawSpark();

    if (ram.used_gb != null) { $('t-ram').innerHTML = `${fmt1(ram.used_gb)}<small>/ ${ram.total_gb ?? '?'} GB</small>`; $('b-ram').style.width = (ram.total_gb ? ram.used_gb / ram.total_gb * 100 : ram.load || 0) + '%'; }
    if (gpu.vram_used_gb != null) { txt('k-vram', 'VRAM'); $('bar-vram').style.visibility = ''; $('t-vram').innerHTML = `${fmt1(gpu.vram_used_gb)}<small>/ ${gpu.vram_total_gb ?? '?'} GB</small>`; $('b-vram').style.width = (gpu.vram_total_gb ? gpu.vram_used_gb / gpu.vram_total_gb * 100 : 0) + '%'; $('b-vram').style.background = 'var(--accent)'; }
    else if (d.sys_power != null) { txt('k-vram', 'System power'); $('t-vram').innerHTML = `${fmt1(d.sys_power)}<small>W</small>${ram.swap_used_gb ? ` <small>· swap ${fmt1(ram.swap_used_gb)} GB</small>` : ''}`; $('bar-vram').style.visibility = 'hidden'; }
    $('t-cpu-clock').innerHTML = cpu.clock != null ? `${(cpu.clock / 1000).toFixed(2)}<small>GHz</small>` : '—';
    txt('s-cpu-name', cpu.name || '');

  const FACE_FRAG = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime; uniform vec4 uGaze; uniform vec2 uOpen; uniform vec2 uLid; uniform float uPupil;
uniform float uHappy; uniform vec2 uSquash; uniform vec2 uScale; uniform vec3 uColor; uniform float uGlow; uniform float uAsleep;

out vec4 O;
float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }

float smax(float a, float b, float k){ float h = clamp(.5 + .5*(b - a)/k, 0., 1.); return mix(a, b, h) + k*h*(1. - h); }

// ---- Cute: a soft glowing rounded eye, about 2 wide and 2.4 tall when open ------------------------------------
vec3 eyeCute(vec2 p, float open, float scale, out float mask, out float halo) {
  p /= scale;
  p.x /= uSquash.x; p.y /= uSquash.y;
  float h = 1.06 * max(open, .045);                                       // height follows the blink
  float d = sdBox(p, vec2(1., h), min(.82, h));                          // soft, very round
  d = smax(d, p.y - (h - 2.6 * uLid.x * h), .25);                        // sleepy: the top droops
  float cy = mix(-4.6, -2.15, uHappy);                                   // happy: the bottom arches up

// ---- Glass: a glass sphere with a luminous fibrous iris -----------------------------------------------------------
vec3 eyeGlass(vec2 p, vec2 gaze, float blink, out float mask, out float halo) {
  float open = (1. - blink) * (1. - .95*uAsleep);

  float cx = max(abs(p.x) - 1., 0.);
  float dIn = min(yTop - p.y, p.y - yBot);
  float dOut = length(vec2(cx * 1.3, max(max(p.y - yTop, yBot - p.y), 0.)));
  float inside = (cx <= 0. && dIn > 0.) ? dIn : -dOut;
  float aa = clamp(fwidth(inside) * 1.3, .002, .02);

  float ang = acos(clamp(dot(n, id), -1., 1.));

  vec3 iris = mix(uColor, tint, smoothstep(.3, 1., rr)) * (.32 + .95*fib) * (1.3 - .85*rr);
  iris += uColor * .45 * smoothstep(.5, .82, rr) * (1. - smoothstep(.82, .98, rr));
  iris *= 1. - .8 * smoothstep(.86, 1., rr);

}
